# aster-launcher configuration. Edit these values, then restart
# aster-launcher.exe to apply them.

# AOOSTAR-X panel config file passed to asterctl's --config option.
monitor_config = "Monitor3.json"

# Shared sensor refresh interval, in seconds, applied to BOTH aster-sysinfo
# and hwbridge. Allowed values: 2, 5, 10, 30.
refresh_time = 5

# Legacy per-process overrides (optional, backward compatible). Only used
# when refresh_time is not set; each must also be one of 2, 5, 10, 30.
# sysinfo_refresh = 2
# hwbridge_refresh = 5

# Wake from sleep: re-enumerates the AOOSTAR USB UART (PnP re-enumeration,
# no reboot required) before the children respawn — the panel's USB
# endpoint can stay wedged after Modern Standby ("The semaphore timeout
# period has expired" on writes). Set to false only on units whose panel
# recovers from the soft re-init alone (fresh serial handle + OpenTFT 0x0B).
restart_uart_on_resume = true

# LCD display mode, selectable live from the tray icon's "Display" sub-menu.
# Allowed values: "on" (default), "off", "follow".
#   on     - LCD stays on (normal operation).
#   off    - LCD turns off until you pick "on" again (asterctl keeps the
#            serial port open, so no restart is needed to wake it).
#   follow - LCD mirrors the Windows display power state: off while the
#            monitor is off, on while it is on (or dimmed).
# Optional; when absent the LCD stays on.
# The LCD always turns off when the launcher stops (Quit, kill, crash):
# asterctl watches cfg/display.state as a heartbeat and blanks the screen
# once the launcher stops refreshing it.
# display_mode = "on"
