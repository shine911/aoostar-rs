name: Rust

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'linux/**'
      - 'docs/linux/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

env:
  CARGO_TERM_COLOR: always
  DEBUG_OUTPUT: "true"
  APP_NAME: aoostar-rs
  HASH_FILENAME: aoostar-rs.hash
  LINUX_ARTIFACT_SUFFIX: Linux-x64

permissions:
  contents: write
  checks: write

jobs:
  lint:
    name: Clippy, Rustfmt, Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache dependencies
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libdbus-1-dev

      - uses: auguwu/clippy-action@1.4.0
        with:
          token: ${{secrets.GITHUB_TOKEN}}

      - name: Run rustfmt
        run: cargo fmt --all -- --check

      - name: Unit tests
        run: cargo test

  windows-check:
    name: Windows-target check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache dependencies
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install build deps (llvm for llvm-rc used by winresource)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev llvm

      - name: Add llvm tools to PATH
        run: |
          LLVM_DIR="$(find /usr/lib -maxdepth 2 -type d -path '/usr/lib/llvm-*/bin' -print -quit)"
          echo "$LLVM_DIR" >> "$GITHUB_PATH"

      - name: Check Windows target
        run: cargo check -p aster-launcher --target x86_64-pc-windows-msvc

  build:
    name: Linux-x64 DEB/RPM packages
    needs: lint
    # using an older Ubuntu release on purpose to link against an older libc version for greater compatibility
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # History of 200 should be more than enough to calculate commit count since last release tag.
          fetch-depth: 200
      - name: Fetch all tags to determine version
        run: |
          git fetch origin '+refs/tags/*:refs/tags/*'
          APP_VERSION="$(git describe --match "v[0-9]*" --tags HEAD --always)"
          if [[ "$APP_VERSION" == v[0-9]* ]]; then
            PACKAGE_VERSION="${APP_VERSION#v}"
          else
            PACKAGE_VERSION="0.0.0.git.$APP_VERSION"
          fi
          PACKAGE_VERSION="${PACKAGE_VERSION//-/.}"
          {
            echo "APP_VERSION=$APP_VERSION"
            echo "PACKAGE_VERSION=$PACKAGE_VERSION"
            echo "ARTIFACT_NAME=${{ env.APP_NAME }}-$APP_VERSION-${{ env.LINUX_ARTIFACT_SUFFIX }}"
          } >> "$GITHUB_ENV"

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libdbus-1-dev desktop-file-utils dpkg-dev rpm

      - name: Cache dependencies
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target
        id: cache-target
        uses: actions/cache@v4
        with:
          path: |
            target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Build and verify DEB/RPM packages
        shell: bash
        run: |
          ./linux/package.sh all
          test "$(dpkg-deb --field dist-linux/*.deb Version)" = "${PACKAGE_VERSION}-1"
          test "$(rpm -qp --queryformat '%{VERSION}-%{RELEASE}' dist-linux/*.rpm)" = "${PACKAGE_VERSION}-1"
          ls -lah dist-linux

      - uses: actions/upload-artifact@v4
        id: upload_artifact
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist-linux/*.deb
            dist-linux/*.rpm
          if-no-files-found: error
          retention-days: 3

  release:
    name: GitHub release
    if: github.ref == 'refs/heads/main' || contains(github.ref, 'tags/v')
    needs: [ build ]
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: .
          merge-multiple: true

      - name: Log
        if: env.DEBUG_OUTPUT == 'true'
        shell: bash
        run: |
          echo "--- Structure of downloaded artifacts ---"
          ls -R
          echo "--- Environment ---"
          printenv

      # Use a common timestamp for all matrix build artifacts
      - name: Set build timestamp
        run: |
          echo "TIMESTAMP=$(date +"%Y%m%d_%H%M%S")" >> "$GITHUB_ENV"

      # Add timestamp to development builds
      - name: Prepare GitHub development packages
        if: "!contains(github.ref, 'tags/v')"
        run: |
          echo "append timestamp for development builds"
          for filename in *.deb *.rpm; do
            extension="${filename##*.}"
            mv "$filename" "${filename%.*}-${TIMESTAMP}.$extension"
          done
          echo "create hashes"
          sha256sum ./*.deb ./*.rpm > "$HASH_FILENAME"
          ls -lah

      # Checkout is required for the next `gh release delete` step
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main

      # We have to delete the "latest" release, otherwise `softprops/action-gh-release` will only append the new artifact.
      # This simulates the old marvinpinto/action-automatic-releases action.
      - name: Remove previous pre-release
        run: |
          cd main
          gh release delete latest --cleanup-tag -y || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        if: "!contains(github.ref, 'tags/v')"
        with:
          prerelease: true
          tag_name: latest
          generate_release_notes: true
          name: "Development Build"
          files: |
            *.deb
            *.rpm
            ${{ env.HASH_FILENAME }}

      - name: Prepare GitHub release packages
        if: "contains(github.ref, 'tags/v')"
        run: |
          echo "create hashes"
          sha256sum ./*.deb ./*.rpm > "$HASH_FILENAME"
          ls -lah

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: "contains(github.ref, 'tags/v')"
        with:
          prerelease: false
          generate_release_notes: true
          files: |
            *.deb
            *.rpm
            ${{ env.HASH_FILENAME }}
