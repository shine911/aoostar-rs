# Maps AOOSTAR-X panel sensor labels (left) to the actual labels aster-sysinfo
# produces on this Windows machine (right). Format: "aoostar_label: real_label"
#
# Anything NOT listed here has no equivalent data source available from
# aster-sysinfo on Windows (no per-component temps, no GPU stats, no drive
# temperatures) -- those widgets will keep showing their AOOSTAR-X placeholder
# value regardless of mapping.

net_download_speed: network_Wi-Fi_download_speed
net_upload_speed: network_Wi-Fi_upload_speed
net_ip_address: network_Wi-Fi_address0
cpu_percent: cpu_usage_percent
memory_usage: mem_usage_percent
storage_ssd[0]['used']: storage_ssd[0]_usage_percent
storage_ssd[1]['used']: storage_ssd[1]_usage_percent
