# Stable aliases emitted by aster-sysinfo on Linux.
# The panel labels below are the names used by Monitor3.json; the right-hand
# side is the platform-neutral sensor label published by aster-sysinfo.
cpu_percent: cpu_usage_percent
memory_usage: mem_usage_percent
cpu_temperature: temperature_cpu_value
memory_Temperature: temperature_memory_value
gpu_temperature: temperature_gpu_value
gpu_core: gpu_core
net_upload_speed: network_upload_speed
net_download_speed: network_download_speed
net_ip_address: network_ip_address
